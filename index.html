<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love and Faith</title>
    <link rel="stylesheet" href="/main.css">
</head>
<body>
    <header>
        <div class="header-offerpath">
            <p >Home › List of Offers</p>
            <h2>Your Offer</h2>
            <p>It takes up to 24 hours to prepare a quote—to place an order directly, customize the design yourself</p>
        </div>
    </header>
    
    <div class="productcheckout">
        <div class="productcheckout__product--card">
            <h2>Products</h2>
            <div class="productcheckout__product--info">
                <img src="img/Button.png" alt="">
                <div class="productcheckout__product--name">
                    <p>Poloshirt Hugo</p>
                    <p>13,07 € <br> /each </p>
                </div>
                <div class="productcheckout__size--number">
                    <p>Navy | M</p>
                    <p>Item No.: 000-000</p>
                </div>
                <div class="productcheckout__quantity--picker">
                    <button class="minus--quantity">-</button>
                    <span>1</span>
                    <button class="plus--quantity">+</button>
                    <img src="/img/Vector.png" alt="">

                </div>
            </div>
        </div>
    </div>

</body>
</html>
